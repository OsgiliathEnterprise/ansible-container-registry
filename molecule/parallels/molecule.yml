---

dependency:
  name: galaxy
  options:
    role-file: requirements-standalone.yml
    requirements-file: requirements-collections.yml
driver:
  name: vagrant
  provider:
    name: parallels
platforms:
  - name: idm.osgiliath.test
    box: ${TESTBOX:-bento/fedora-42}
    provider_options:
      cpus: 2
      memory: 2048
    interfaces:
      - type: dhcp
        # ip: "192.168.56.5"
        auto_config: true
        network_name: private_network
        # virtualbox__intnet: "internalnetwork"
    provider_raw_config_args:
      - "customize ['set', :id, '--device-add', 'hdd', '--size', '840']"
    groups:
      - ipaservers
  - name: client.osgiliath.test
    box: ${TESTBOX:-bento/fedora-42}
    provider_options:
      cpus: 2
      memory: 2048
    interfaces:
      - type: dhcp
        # ip: "192.168.56.5"
        auto_config: true
        network_name: private_network
        # virtualbox__intnet: "internalnetwork"
    provider_raw_config_args:
      - "customize ['set', :id, '--device-add', 'hdd', '--size', '840']"
    groups:
      - ipaclients
provisioner:
  name: ansible
  env:
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../community-collections:${ANSIBLE_COLLECTIONS_PATH}"
    ANSIBLE_REMOTE_TMP: /var/tmp/ansible-remote
    ANSIBLE_ASYNC_DIR: "/tmp/.ansible_async"
  options:
    vvv: True
  config_options:
    defaults:
      remote_tmp: /var/tmp/ansible-remote
verifier:
  name: testinfra
  env:
    PYTHONWARNINGS: "ignore:.*U.*mode is deprecated:DeprecationWarning"
  options:
    v: 1
scenario:
  name: parallels
